[workspace]
members = ["cargo:."]

# Config for 'dist'
[dist]
# The preferred dist version to use in CI (Cargo.toml SemVer syntax)
cargo-dist-version = "0.29.0"
# CI backends to support
ci = "github"
# Only root release tags (vX.Y.Z) should invoke cargo-dist. Language SDKs in
# subdirectories use namespaced tags such as secretspec-go/vX.Y.Z.
tag-namespace = "v"
# The installers to generate for each app
installers = ["shell"]
# Build only the `secretspec` CLI app, package-by-package, instead of a
# `cargo build --workspace`. The workspace now includes cdylib SDK crates
# (e.g. the pyo3 `secretspec-py-native`) that do not link standalone on macOS,
# so a whole-workspace release build fails; precise builds skip them.
precise-builds = true
# Target platforms to build apps for (Rust target-triple syntax)
#
# aarch64-pc-windows-msvc is omitted on purpose: dist refuses to build a target
# whose standalone updater it cannot fetch, and axoupdater publishes no binary
# for it (axodotdev/axoupdater#313). Because install-updater is a global
# setting, adding the target would mean dropping the updater for every
# platform. Windows ARM64 hosts run the x86_64 build under emulation, which is
# what the installer already selects for them. Add the target back once
# axoupdater ships that asset.
targets = ["aarch64-apple-darwin", "aarch64-unknown-linux-gnu", "x86_64-apple-darwin", "x86_64-unknown-linux-gnu", "x86_64-pc-windows-msvc"]
# Path that installers should place binaries in
install-path = "CARGO_HOME"
# Whether to install an updater program
install-updater = true

# https://github.com/axodotdev/cargo-dist/issues/74
[dist.github-custom-runners]
aarch64-unknown-linux-gnu = "ubuntu-24.04-arm"
aarch64-apple-darwin = "macos-latest"
x86_64-apple-darwin = "macos-15"
