name: Publish container image

# Called by cargo-dist after the release artifacts have been built and hosted.
# Prereleases are skipped by cargo-dist's default publish policy.
on:
  workflow_call:
    inputs:
      plan:
        required: true
        type: string

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    env:
      RELEASE_TAG: ${{ fromJson(inputs.plan).announcement_tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Download static Linux release artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: artifacts-build-local-*linux-musl*
          path: artifacts
          merge-multiple: true

      - name: Stage the binaries
        shell: bash
        run: |
          set -euo pipefail
          for pair in amd64:x86_64 arm64:aarch64; do
            arch=${pair%%:*}
            target=${pair#*:}-unknown-linux-musl
            archive="secretspec-${target}.tar.xz"
            (cd artifacts && sha256sum --check "${archive}.sha256")
            mkdir -p "docker/linux/${arch}" "$RUNNER_TEMP/$target"
            tar -xJf "artifacts/$archive" -C "$RUNNER_TEMP/$target" --strip-components=1
            cp "$RUNNER_TEMP/$target/secretspec" "docker/linux/${arch}/secretspec"
          done
          echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"
          echo "VERSION=${RELEASE_TAG#v}" >> "$GITHUB_ENV"

      - uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Smoke test both architectures
        shell: bash
        run: |
          set -euo pipefail
          for arch in amd64 arm64; do
            docker buildx build --platform "linux/$arch" --load \
              --tag "secretspec-test:$arch" docker
            output=$(docker run --rm --platform "linux/$arch" "secretspec-test:$arch" --version)
            test "$output" = "secretspec $VERSION"
          done

      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish the multi-platform image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: docker
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ env.IMAGE }}:${{ env.VERSION }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.version=${{ env.VERSION }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.licenses=Apache-2.0
