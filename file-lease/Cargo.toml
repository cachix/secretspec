[package]
name = "file-lease"
version = "0.1.0"
edition.workspace = true
license = "Apache-2.0"
repository = "https://github.com/cachix/secretspec"
description = "Process-owned memory-backed files with automatic cleanup"
readme = "README.md"

[target.'cfg(unix)'.dependencies]
libc.workspace = true
zeroize = { version = "1.8", default-features = false, features = ["alloc"] }

[target.'cfg(target_os = "linux")'.dependencies]
rustix = { version = "1", features = ["fs", "process"] }

[target.'cfg(target_os = "macos")'.dependencies]
core-foundation = "0.10"
wait-timeout.workspace = true
serde.workspace = true
serde_json.workspace = true
tempfile.workspace = true
uuid.workspace = true

[dev-dependencies]
tempfile.workspace = true
wait-timeout.workspace = true

# SecretSpec hosts the helper itself. Its release archives need no second binary.
[package.metadata.dist]
dist = false
