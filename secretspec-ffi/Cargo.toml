[package]
name = "secretspec-ffi"
version.workspace = true
edition.workspace = true
repository = "https://github.com/cachix/secretspec"
description = "C ABI for SecretSpec: resolve secrets from any language"
license = "Apache-2.0"

[lib]
name = "secretspec_ffi"
# cdylib for dynamic loading (the SDK distribution target); staticlib for
# embedding; lib (rlib) so Rust integration tests can call the entry points.
# All expose the same narrow C ABI.
crate-type = ["cdylib", "staticlib", "lib"]

# cargo-c enables this feature when building the C ABI; the ABI here is
# unconditional, so it gates nothing.
[features]
capi = []

# Read by cargo-c when the static or shared library is installed with the C
# header and a generated secretspec_ffi.pc.
[package.metadata.capi.library]
name = "secretspec_ffi"

# The header in include/ is hand-maintained; consumers expect it at the
# include root as #include "secretspec.h".
[package.metadata.capi.header]
generation = false
subdirectory = ""

[package.metadata.capi.install.include]
asset = [{ from = "include/secretspec.h", to = "" }]

[package.metadata.capi.pkg_config]
name = "secretspec_ffi"
filename = "secretspec_ffi"
description = "C ABI for SecretSpec: resolve secrets from any language"

[dependencies]
# The envelope/resolve logic lives in the secretspec crate (resolve_json); this
# crate is only the C ABI wrapper.
secretspec = { workspace = true }

[dev-dependencies]
serde_json = { workspace = true }
tempfile = { workspace = true }
