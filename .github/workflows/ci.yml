name: ci

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  merge_group:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  security:
    timeout-minutes: 5
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      security-events: write
    steps:
      - name: checkout repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - name: run zizmor
        uses: zizmorcore/zizmor-action@192e21d79ab29983730a13d1382995c2307fbcaa # v0.5.7
        with:
          inputs: ".github/workflows/ .github/actions/"
          advanced-security: true

  lint:
    timeout-minutes: 60
    runs-on: ubuntu-latest
    steps:
      - name: checkout repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - name: setup
        uses: ./.github/actions/devenv
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: rustfmt
        run: rustup run nightly cargo fmt --all -- --check
        shell: devenv shell -- bash -e {0}
      - name: dprint
        run: dprint check
        shell: devenv shell -- bash -e {0}
      - name: taplo
        run: git ls-files -z '*.toml' | xargs -0 taplo fmt --check
        shell: devenv shell -- bash -e {0}
      - name: dart format
        run: dart format --output=none --set-exit-if-changed dart/monosecret dart/monosecret_builder
        shell: devenv shell -- bash -e {0}
      - name: clippy
        run: cargo clippy --all-targets --all-features --locked
        shell: devenv shell -- bash -e {0}
      - name: dart analyze
        run: dart analyze .
        shell: devenv shell -- bash -e {0}
      - name: validate monochange configuration
        run: monochange step validate
        shell: devenv shell -- bash -e {0}

  test:
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-26
    runs-on: ${{ matrix.os }}
    steps:
      - name: checkout repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - name: setup
        uses: ./.github/actions/devenv
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          free-runner-space: ${{ runner.os == 'Linux' && 'true' || 'false' }}
      - name: rust tests
        run: cargo test --all --all-features --locked
        shell: devenv shell -- bash -e {0}
      - name: dart tests
        run: |
          cargo build -p monosecret_ffi
          dart run melos exec --fail-fast -- dart test
        shell: devenv shell -- bash -e {0}
      - name: native language SDK tests
        run: bash scripts/ci-sdks.sh
        shell: devenv shell -- bash -e {0}

  build:
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-26
          - windows-latest
    runs-on: ${{ matrix.os }}
    steps:
      - name: checkout repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - name: setup devenv
        if: runner.os != 'Windows'
        uses: ./.github/actions/devenv
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          free-runner-space: ${{ runner.os == 'Linux' && 'true' || 'false' }}
      - name: setup rust on windows
        if: runner.os == 'Windows'
        uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # stable branch snapshot; installs stable
        with:
          toolchain: stable
      - name: build on unix
        if: runner.os != 'Windows'
        run: cargo build --workspace --all-features --locked
        shell: devenv shell -- bash -e {0}
      - name: build on windows
        if: runner.os == 'Windows'
        run: cargo build --workspace --all-features --locked

  packaging:
    timeout-minutes: 30
    runs-on: ubuntu-latest
    steps:
      - name: checkout repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: setup
        uses: ./.github/actions/devenv
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: cargo package dry-run
        run: cargo package -p monosecret -p monosecret_derive --allow-dirty --locked
        shell: devenv shell -- bash -e {0}
      - name: npm package dry-run
        run: |
          for package in npm/monosecret__cli npm/monosecret__client npm/monosecret__skill npm/monosecret__cli-* npm/monosecret__client-*; do
            (cd "$package" && npm pack --dry-run)
          done
        shell: devenv shell -- bash -e {0}
      - name: native SDK non-publishing package checks
        run: package:sdks:check
        shell: devenv shell -- bash -e {0}
      - name: dart publish dry-run
        run: |
          for package in dart/monosecret dart/monosecret_builder; do
            (cd "$package" && dart pub publish --dry-run --skip-validation)
          done
        shell: devenv shell -- bash -e {0}

  coverage:
    timeout-minutes: 60
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - name: checkout repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: setup
        uses: ./.github/actions/devenv
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          free-runner-space: "true"
      - name: rust coverage
        run: |
          mkdir -p coverage
          rustup run nightly cargo llvm-cov --all-features --workspace --lcov --no-cfg-coverage-nightly --output-path coverage/rust.lcov
        shell: devenv shell -- bash -e {0}
      - name: dart coverage
        run: |
          dart pub get
          cargo build -p monosecret_ffi
          dart run melos exec --fail-fast -- dart test --coverage=coverage
          for package in dart/monosecret dart/monosecret_builder; do
            (
              cd "$package"
              dart run coverage:format_coverage \
                --lcov \
                --in=coverage \
                --out=coverage/lcov.info \
                --package=. \
                --report-on=lib
            )
          done
        shell: devenv shell -- bash -e {0}
      - name: typescript coverage
        run: pnpm --filter @monosecret/client run coverage
        shell: devenv shell -- bash -e {0}
      - name: upload coverage artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coverage-reports
          path: |
            coverage/rust.lcov
            dart/monosecret/coverage/lcov.info
            dart/monosecret_builder/coverage/lcov.info
            npm/monosecret__client/coverage/lcov.info
          if-no-files-found: error
          retention-days: 7

      - name: upload coverage to codecov
        if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v7.0.0
        with:
          files: ./coverage/rust.lcov
          disable_search: true
          plugins: noop
          fail_ci_if_error: false
          flags: rust,crate-monosecret,crate-monosecret-derive
          name: monosecret-rust
          use_oidc: true
          verbose: true

      - name: upload dart sdk coverage to codecov
        if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v7.0.0
        with:
          files: ./dart/monosecret/coverage/lcov.info
          disable_search: true
          plugins: noop
          fail_ci_if_error: false
          flags: dart,dart-monosecret
          name: monosecret-dart-sdk
          use_oidc: true
          verbose: true

      - name: upload dart builder coverage to codecov
        if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v7.0.0
        with:
          files: ./dart/monosecret_builder/coverage/lcov.info
          disable_search: true
          plugins: noop
          fail_ci_if_error: false
          flags: dart,dart-monosecret-builder
          name: monosecret-dart-builder
          use_oidc: true
          verbose: true

      - name: upload npm coverage to codecov
        if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v7.0.0
        with:
          files: ./npm/monosecret__client/coverage/lcov.info
          disable_search: true
          plugins: noop
          fail_ci_if_error: false
          flags: npm,npm-monosecret-client
          name: monosecret-npm
          use_oidc: true
          verbose: true
