name: File lease lifecycle

on:
  pull_request:
    paths:
      - Cargo.toml
      - Cargo.lock
      - secretspec/Cargo.toml
      - secretspec/src/file_lease.rs
      - secretspec/src/cli/mod.rs
      - secretspec/tests/file_lease_cli.rs
      - secretspec/tests/file_storage.rs
      - secretspec/tests/as_path_materializer.rs
      - secretspec/src/secrets.rs
      - secretspec/src/config.rs
      - secretspec/src/validation.rs
      - secretspec/src/serve.rs
      - secretspec/src/redaction.rs
      - secretspec/src/native.rs
      - secretspec/src/resolve.rs
      - .github/workflows/file-leases.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: file-leases-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  lifecycle:
    name: SecretSpec file delivery (${{ matrix.runner }})
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-latest, macos-15, macos-26, windows-latest]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install the pinned Rust toolchain
        run: |
          rustup show
      - uses: Swatinem/rust-cache@c8037a86dde8214a8310e9f54a8fc61ab362aa31 # v2
        with:
          key: file-leases
      - name: Test SecretSpec CLI and resolver integration
        run: |
          cargo test --locked -p secretspec --no-default-features --features cli --test file_lease_cli --test file_storage
          cargo test --locked -p secretspec --no-default-features --features cli --test as_path_materializer --test ipc_resolver --test check_report_stream --test run_config_env
