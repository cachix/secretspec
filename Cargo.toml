[workspace]
members = [
  "conformance/ipc/runner",
  "crates/monosecret",
  "crates/monosecret_derive",
  "crates/monosecret_ffi",
  "crates/monosecret_ipc",
  "examples/derive",
  "npm/monosecret__client",
  "php/monosecret_php",
  "python/monosecret_py",
]
resolver = "2"

# Plain `cargo build` / `cargo check` / `cargo test` operate on the CLI crate
# only. The other members (ffi, npm, php, python, examples) pull in language
# interpreters at build time — ext-php-rs needs `php`, pyo3 needs `python`, and
# napi needs `node` — which breaks sandboxed environments that only need the
# CLI, such as Nix builds. CI and devenv select the full workspace explicitly
# via --workspace / --all / -p, so nothing changes for them.
default-members = ["crates/monosecret"]

[workspace.package]
version = "0.4.0"
edition = "2024"

[workspace.dependencies]
age = { version = "0.12", features = ["armor", "plugin", "ssh"] }
async-trait = "0.1"
monosecret-ipc = { version = "0.4.0", path = "./crates/monosecret_ipc" }
aws-config = { default-features = false, version = "^1" }
aws-sdk-secretsmanager = { default-features = false, version = "^1" }
aws-sdk-ssm = { default-features = false, version = "^1" }
azure_core = "1.0.0"
azure_identity = "1.0.0"
azure_security_keyvault_secrets = "1.0.0"
base64 = "0.23"
clap = { version = "4", features = ["derive", "env"] }
clap_complete = { version = "4.6", features = ["unstable-dynamic"] }
clap_complete_nushell = "4.6"
colored = { default-features = false, version = "^3" }
data-encoding = "2"
detect-coding-agent = { default-features = false, version = "^0.1" }
dotenv = { package = "dotenv-ng", version = "1.0.0" }
dunce = "1.0"
etcetera = { default-features = false, version = "^0.11" }
google-cloud-secretmanager-v1 = { default-features = false, version = "^1.10.0" }
http = { default-features = false, features = ["std"], version = "^1.4" }
ini = { package = "rust-ini", version = "0.21.3" }
inquire = { version = "0.9.4", default-features = false, features = [
  "console",
  "experimental-multiline-input",
] }
insta = { version = "1", features = [
  "filters",
  "json",
  "redactions",
], default-features = false }
insta-cmd = { default-features = false, version = "^0.7" }
is_executable = "1.0"
jiff = "0.2"
json-patch = "4.2.0"
k8s-openapi = { version = "0.28", features = ["v1_36"] }
keepass = { version = "=0.13.17", features = ["save_kdbx4"] }
keeper-secrets-manager-core = { version = "17.3.0", default-features = false, features = [
  "blocking",
] }
keyring = "4.1.6"
kube = { version = "4.2", default-features = false, features = [
  "client",
  "rustls-tls",
  "aws-lc-rs",
  "jsonpatch",
] }
libc = "0.2"
linkme = { default-features = false, version = "^0.3" }
miette = { version = "7.6", features = [
  "derive",
  "fancy",
], default-features = false }
percent-encoding = { default-features = false, version = "^2.3" }
pgp = { version = "0.20", default-features = false }
proc-macro2 = { default-features = false, version = "^1.0" }
proptest = "1"
quote = { default-features = false, version = "^1.0" }
rand = "0.10"
# rPGP 0.20's public generation API uses Rand 0.8's traits. Keep the older
# version under an explicit alias until rPGP moves to the current Rand API.
rand_08 = { package = "rand", version = "0.8.6" }
reqwest = { version = "0.13", default-features = false, features = [
  "json",
  "query",
  "rustls",
] }
rsa = { version = "0.9", features = ["pem"] }
same-file = "1"
schemars = "1.2"
secrecy = { version = "0.10.3", features = ["serde"], default-features = false }
security-framework = "3.7"
serde = { version = "1.0", features = ["derive"], default-features = false }
serde_json = "1.0"
sha2 = "0.11"
smallvec = "1"
ssh-key = { version = "0.6.7", features = ["crypto"] }
signal-hook = "0.4"
syn = { default-features = false, version = "^3.0" }
tempfile = { default-features = false, version = "^3" }
wait-timeout = "0.2"
windows-sys = { version = "0.61", features = [
  "Win32_Foundation",
  "Win32_Security",
  "Win32_Security_Authorization",
  "Win32_Storage_FileSystem",
  "Win32_System_Diagnostics_ToolHelp",
  "Win32_System_IO",
  "Win32_System_JobObjects",
  "Win32_System_SystemServices",
  "Win32_System_Threading",
] }
thiserror = { default-features = false, version = "^2.0" }
tokio = { version = "1", features = [
  "rt",
  "rt-multi-thread",
], default-features = false }
tokio-util = { version = "0.7", features = ["rt"] }
toml = "1.1"
toml_edit = { version = "0.25", features = ["serde"] }
tracing = { default-features = false, version = "^0.1" }
trybuild = { default-features = false, version = "^1.0" }
url = "2.5"
uuid = { version = "1", features = ["serde", "v4"], default-features = false }
# Default features are required: whoami's `std` feature is what compiles the
# real platform backend. Without it, native builds silently get the stub that
# reports `"anonymous"` for `whoami::username()`, which mis-addresses every
# keyring entry (the account coordinate) on macOS/Linux/Windows.
whoami = "^2.1"

# internal crates
monosecret = { version = "0.4.0", path = "./crates/monosecret", default-features = false }
monosecret_derive = { version = "0.4.0", path = "./crates/monosecret_derive" }
# The profile that 'dist' will build with
[profile.dist]
inherits = "release"
lto = "fat"
codegen-units = 1
strip = "symbols"

[workspace.lints.rust]
rust_2021_compatibility = { level = "warn", priority = -1 }
rust_2024_compatibility = { level = "warn", priority = -1 }
unsafe_code = "allow"
unstable_features = "deny"
unused_extern_crates = "warn"
unused_import_braces = "warn"
unused_lifetimes = "warn"
unused_macro_rules = "warn"
unused_qualifications = "warn"
variant_size_differences = "warn"
edition_2024_expr_fragment_specifier = "allow"

[workspace.lints.clippy]
complexity = { level = "deny", priority = -1 }
correctness = { level = "deny", priority = -1 }
pedantic = { level = "deny", priority = -1 }
perf = { level = "deny", priority = -1 }
style = { level = "deny", priority = -1 }
suspicious = { level = "deny", priority = -1 }
blocks_in_conditions = "allow"
cargo_common_metadata = "allow"
cast_possible_truncation = "allow"
cast_possible_wrap = "allow"
cast_precision_loss = "allow"
cast_sign_loss = "allow"
expl_impl_clone_on_copy = "allow"
items_after_statements = "allow"
indexing_slicing = "deny"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
module_name_repetitions = "allow"
must_use_candidate = "allow"
no_effect_underscore_binding = "allow"
tabs_in_doc_comments = "allow"
too_many_lines = "allow"
wildcard_dependencies = "deny"
wildcard_imports = "allow"
