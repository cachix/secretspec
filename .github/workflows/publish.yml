name: Publish Crates

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Git tag to publish (e.g., 0.1.2 or v0.1.2)"
        required: true
        type: string
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+*"

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}

      # The full devenv shell includes every SDK toolchain plus the musl static
      # dependencies. It no longer fits alongside the preinstalled software on
      # GitHub's Ubuntu image, so reclaim that space before populating /nix.
      - name: Free up disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android \
            /opt/hostedtoolcache/CodeQL /usr/local/.ghcup /opt/ghc \
            /usr/local/share/boost /usr/local/share/powershell
          sudo docker image prune --all --force
          df -h /

      - uses: cachix/install-nix-action@75c75c31ebece974e48ebc36b4ad125bd97bd97b # v31.11.3
      - uses: cachix/cachix-action@38b082610b782e7e93e209c35fd730d399dee866 # v17
        with:
          name: devenv
      - name: Install devenv.sh
        run: nix profile install nixpkgs#devenv

      - uses: rust-lang/crates-io-auth-action@3268eb413133e2960fa4ae0e963ca76380c54cd9 # v1.0.6
        id: auth

      - name: Publish Rust crates
        # Publish file-lease from cachix/file-lease before releasing SecretSpec.
        # Workspace crates are published in dependency order: the main crate
        # depends on secretspec-ipc, and the derive crate on the main crate.
        # Registry checks make retries
        # idempotent when a previous run published successfully but failed
        # during cleanup.
        shell: bash
        run: |
          set -euo pipefail
          version="$(sed -n '/^\[workspace.package\]/,/^\[/s/^version = "\(.*\)"/\1/p' Cargo.toml)"
          user_agent="secretspec-release/${version} (https://github.com/cachix/secretspec)"

          metadata="$(devenv shell cargo metadata --no-deps --format-version 1)"
          for crate in secretspec-ipc secretspec secretspec-derive; do
            crate_version="$(jq -er --arg name "$crate" '.packages[] | select(.name == $name) | .version' <<< "$metadata")"
            if curl -fsS -A "$user_agent" \
              "https://crates.io/api/v1/crates/${crate}/${crate_version}" >/dev/null; then
              echo "${crate} ${crate_version} is already published"
              continue
            fi

            devenv shell cargo publish -p "$crate"

            published=false
            for _ in $(seq 1 30); do
              if curl -fsS -A "$user_agent" \
                "https://crates.io/api/v1/crates/${crate}/${crate_version}" >/dev/null; then
                published=true
                break
              fi
              sleep 10
            done
            if [[ "$published" != true ]]; then
              echo "${crate} ${crate_version} was not visible on crates.io after five minutes" >&2
              exit 1
            fi
          done
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
