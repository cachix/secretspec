name: monosecret_builder
description: Build runner generator for typed Dart access to Monosecret manifests.
version: 0.4.0
repository: https://github.com/ifiokjr/monosecret/tree/main/dart/monosecret_builder
resolution: workspace
environment:
  sdk: ^3.10.0
dependencies:
  # CI's devenv pins the Dart SDK at 3.10.9: analyzer 13+, source_gen 4.3+,
  # and build 4.0.8+ all require SDK 3.11, so the ranges below must keep the
  # resolution on the newest 3.10-compatible set regardless of the local SDK.
  analyzer: ">=12.0.0 <13.0.0"
  build: ">=4.0.0 <4.0.8"
  monosecret: ^0.4.0
  source_gen: ">=4.2.4 <4.3.0"
  toml: ^0.18.0
dev_dependencies:
  # build_runner 2.16+ and test 1.32+ require SDK 3.11 (see the note above).
  build_runner: ">=2.8.0 <2.16.0"
  coverage: ^1.9.0
  test: ">=1.25.0 <1.32.0"
