[workspace]
members = [
  "crates/monosecret",
  "crates/monosecret_derive",
  "crates/monosecret_ffi",
  "examples/derive",
  "npm/monosecret__client",
  "php/monosecret_php",
  "python/monosecret_py",
]
resolver = "2"

[workspace.package]
version = "0.2.1"
edition = "2024"

[workspace.dependencies]
age = { version = "0.12", features = ["armor", "plugin", "ssh"] }
apple-native-keyring-store = { version = "1.0.0", features = [
  "keychain",
], default-features = false }
aws-config = { default-features = false, version = "^1" }
aws-sdk-secretsmanager = { default-features = false, version = "^1" }
aws-sdk-ssm = { default-features = false, version = "^1" }
azure_core = "1.0.0"
azure_identity = "1.0.0"
azure_security_keyvault_secrets = "1.0.0"
base64 = "0.22"
bitwarden = { version = "2", features = ["secrets"], default-features = false }
clap = { version = "4", features = ["derive", "env"] }
colored = { default-features = false, version = "^3" }
data-encoding = "2"
detect-coding-agent = { default-features = false, version = "^0.1" }
dotenvy = { default-features = false, version = "^0.15" }
etcetera = { default-features = false, version = "^0.11" }
google-cloud-secretmanager-v1 = { default-features = false, version = "^1.10.0" }
http = { default-features = false, features = ["std"], version = "^1.4" }
inquire = { version = "0.9.4", features = ["experimental-multiline-input"] }
insta = { version = "1", features = [
  "filters",
  "json",
  "redactions",
], default-features = false }
insta-cmd = { default-features = false, version = "^0.7" }
jiff = "0.2"
keepass = { version = "0.13.17", features = ["save_kdbx4"] }
keeper-secrets-manager-core = { version = "17.3.0", default-features = false, features = [
  "blocking",
] }
keyring = "4.1.6"
keyring-core = { default-features = false, version = "^1" }
linkme = { default-features = false, version = "^0.3" }
miette = { version = "7.6", features = [
  "derive",
  "fancy",
], default-features = false }
percent-encoding = { default-features = false, version = "^2.3" }
proc-macro2 = { default-features = false, version = "^1.0" }
proptest = "1"
quote = { default-features = false, version = "^1.0" }
rand = "0.9"
reqwest = { version = "0.12", default-features = false, features = [
  "json",
  "rustls-tls-native-roots",
] }
rsa = { version = "0.9", features = ["pem"] }
rustls = { version = "0.23", default-features = false, features = [
  "aws_lc_rs",
] }
same-file = "1"
secrecy = { version = "0.10.3", features = ["serde"], default-features = false }
serde = { version = "1.0", features = ["derive"], default-features = false }
serde_json = "1.0"
syn = { default-features = false, version = "^2.0" }
tempfile = { default-features = false, version = "^3" }
thiserror = { default-features = false, version = "^2.0" }
tokio = { version = "1", features = [
  "rt",
  "rt-multi-thread",
], default-features = false }
toml = "0.9"
toml_edit = "0.23"
tracing = { default-features = false, version = "^0.1" }
trybuild = { default-features = false, version = "^1.0" }
url = "2.5"
uuid = { version = "1", features = ["serde", "v4"], default-features = false }
whoami = { default-features = false, version = "^2.1" }
windows-native-keyring-store = { default-features = false, version = "^1.1.0" }
zbus-secret-service-keyring-store = { version = "1.0.0", features = [
  "rt-tokio-crypto-rust",
], default-features = false }

# internal crates
monosecret = { version = "0.2.1", path = "./crates/monosecret", default-features = false }
monosecret_derive = { version = "0.2.1", path = "./crates/monosecret_derive" }
monosecret_ffi = { version = "0.2.1", path = "./crates/monosecret_ffi" }
# The profile that 'dist' will build with
[profile.dist]
inherits = "release"
lto = "fat"
codegen-units = 1
strip = "symbols"

[workspace.lints.rust]
rust_2021_compatibility = { level = "warn", priority = -1 }
rust_2024_compatibility = { level = "warn", priority = -1 }
unsafe_code = "allow"
unstable_features = "deny"
unused_extern_crates = "warn"
unused_import_braces = "warn"
unused_lifetimes = "warn"
unused_macro_rules = "warn"
unused_qualifications = "warn"
variant_size_differences = "warn"
edition_2024_expr_fragment_specifier = "allow"

[workspace.lints.clippy]
complexity = { level = "warn", priority = -1 }
correctness = { level = "deny", priority = -1 }
pedantic = { level = "warn", priority = -1 }
perf = { level = "warn", priority = -1 }
style = { level = "warn", priority = -1 }
suspicious = { level = "warn", priority = -1 }
blocks_in_conditions = "allow"
cargo_common_metadata = "allow"
cast_possible_truncation = "allow"
cast_possible_wrap = "allow"
cast_precision_loss = "allow"
cast_sign_loss = "allow"
expl_impl_clone_on_copy = "allow"
items_after_statements = "allow"
indexing_slicing = "warn"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
module_name_repetitions = "allow"
must_use_candidate = "allow"
no_effect_underscore_binding = "allow"
tabs-in-doc-comments = "allow"
too_many_lines = "allow"
wildcard_dependencies = "deny"
wildcard_imports = "allow"
