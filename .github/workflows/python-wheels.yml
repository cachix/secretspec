name: "Python wheels"

# Builds portable abi3 wheels for the Python SDK and publishes them to PyPI on a
# version tag. The Rust resolver is statically linked into a compiled pyo3
# extension (secretspec-py-native, see secretspec-py/Cargo.toml) -- there is no
# separate cdylib bundled. The extension targets pyo3's abi3-py39 feature, so
# one cp39-abi3 wheel per platform serves all CPython >= 3.9 with the GIL.
#
# Free-threaded CPython (3.14t) cannot load abi3 extensions, so each platform
# also gets a version-specific cp314t wheel: built against a free-threaded
# interpreter, pyo3 drops abi3, and since pyo3 0.28 the bare #[pymodule]
# declares free-threading support, so importing it keeps the GIL disabled.
# An sdist is published too, so any interpreter without a matching wheel can
# still build from source (it bundles the workspace crates it needs).
#
# Linux wheels are built via PyO3/maturin-action inside a manylinux container
# (old glibc); maturin repairs the wheel itself, so no separate auditwheel step
# is needed. macOS builds natively.
#
# Windows builds natively on the MSVC toolchain and uses Windows Credential
# Manager. The SDK itself is exercised on every PR by the devenv-based sdks.yml;
# this workflow only builds the distributable wheels.
#
# The build/repair pipeline is validated in CI; the publish job additionally
# needs PyPI Trusted Publishing configured for this repo's "pypi" environment
# before the first version tag.

on:
  workflow_call:
    inputs:
      pre_release:
        description: Run as part of the canonical pre-release suite
        required: false
        type: boolean
        default: false
  workflow_dispatch:
  push:
    tags:
      - v**
  # PR runs are scoped to changes in the Python SDK or this workflow. Core
  # resolver and FFI changes are verified on PRs by the devenv-based test.yml,
  # sdks.yml, and ffi-build.yml; the full matrix here still runs on tags and
  # manual dispatch.
  pull_request:
    paths:
      - "secretspec-py/**"
      - ".github/workflows/python-wheels.yml"
      - "scripts/sync-sdk-versions.sh"

permissions:
  contents: read

jobs:
  linux:
    name: wheel ${{ matrix.arch }} ${{ matrix.interpreter || 'abi3' }} (manylinux)
    if: >-
      inputs.pre_release ||
      github.event_name != 'pull_request' ||
      !startsWith(github.event.pull_request.title, 'Release ')
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { arch: x86_64, target: x86_64-unknown-linux-gnu, runner: ubuntu-latest }
          - { arch: aarch64, target: aarch64-unknown-linux-gnu, runner: ubuntu-24.04-arm }
          # Free-threaded: the manylinux image ships /opt/python/cp314-cp314t.
          - { arch: x86_64, target: x86_64-unknown-linux-gnu, runner: ubuntu-latest, interpreter: python3.14t }
          - { arch: aarch64, target: aarch64-unknown-linux-gnu, runner: ubuntu-24.04-arm, interpreter: python3.14t }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Sync SDK package versions
        run: bash scripts/sync-sdk-versions.sh
      - name: Build wheel (manylinux)
        uses: PyO3/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b # v1.51.0
        with:
          working-directory: secretspec-py
          target: ${{ matrix.target }}
          manylinux: 2_28
          rust-toolchain: "1.92.0" # matches rust-toolchain.toml
          # Compiler cache backed by the GitHub Actions cache; works inside
          # the manylinux container, where a host-level cargo cache cannot.
          sccache: true
          args: >-
            --release --out ${{ github.workspace }}/wheelhouse
            ${{ matrix.interpreter && format('--interpreter {0}', matrix.interpreter) || '' }}
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: wheels-linux-${{ matrix.arch }}${{ matrix.interpreter && '-freethreaded' || '' }}
          path: wheelhouse/*.whl

  native:
    name: wheel ${{ matrix.target }} ${{ matrix.freethreaded && 'cp314t' || 'abi3' }}
    if: >-
      inputs.pre_release ||
      github.event_name != 'pull_request' ||
      !startsWith(github.event.pull_request.title, 'Release ')
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { target: macos-aarch64, runner: macos-latest, python: "3.11" }
          - { target: windows-x86_64, runner: windows-latest, python: "3.11" }
          - { target: macos-aarch64, runner: macos-latest, python: "3.14t", freethreaded: true }
          - { target: windows-x86_64, runner: windows-latest, python: "3.14t", freethreaded: true }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Sync SDK package versions
        run: bash scripts/sync-sdk-versions.sh
      - name: Install Rust (pinned by rust-toolchain.toml)
        run: rustup toolchain install
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        id: python
        with:
          python-version: ${{ matrix.python }}
      - name: Build wheel
        uses: PyO3/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b # v1.51.0
        with:
          working-directory: secretspec-py
          sccache: true
          args: >-
            --release --out ${{ github.workspace }}/wheelhouse
            ${{ matrix.freethreaded && format('--interpreter {0}', steps.python.outputs.python-path) || '' }}
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: wheels-${{ matrix.target }}${{ matrix.freethreaded && '-freethreaded' || '' }}
          path: wheelhouse/*.whl

  sdist:
    name: sdist
    if: >-
      inputs.pre_release ||
      github.event_name != 'pull_request' ||
      !startsWith(github.event.pull_request.title, 'Release ')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Sync SDK package versions
        run: bash scripts/sync-sdk-versions.sh
      - name: Build sdist
        uses: PyO3/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b # v1.51.0
        with:
          working-directory: secretspec-py
          command: sdist
          args: --out ${{ github.workspace }}/wheelhouse
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sdist
          path: wheelhouse/*.tar.gz

  publish:
    name: publish to PyPI
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: [linux, native, sdist]
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write # PyPI Trusted Publishing (OIDC), no token needed
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: dist
          merge-multiple: true
      - uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3
        with:
          packages-dir: dist
