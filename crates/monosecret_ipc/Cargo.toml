[package]
name = "monosecret-ipc"
version = "0.4.0"
edition.workspace = true
repository = "https://github.com/ifiokjr/monosecret/tree/main/crates/monosecret_ipc"
description = "Independent Rust implementation of the Monosecret IPC protocols"
license = "Apache-2.0"

[lints]
workspace = true

[features]
default = ["tokio"]
# Synchronous `monosecret.resolver/1` sessions over `std::process`, for consumers
# that have no async runtime and must not acquire one. Adds no dependencies.
blocking = []
tokio = ["dep:async-trait", "dep:tokio", "dep:tokio-util"]

[dependencies]
async-trait = { workspace = true, optional = true }
# The internally tagged / flattened representations below reach into serde's
# private serializer helpers, which only exist with `std` enabled. The fork's
# workspace default is `default-features = false` (the core crate wants
# `alloc`-only), so opt back in here.
serde = { workspace = true, features = ["std"] }
serde_json.workspace = true
thiserror.workspace = true
tokio = { workspace = true, optional = true, features = [
  "io-util",
  "macros",
  "process",
  "sync",
  "time",
] }
tokio-util = { workspace = true, optional = true }
# `Zeroizing` only. Declared here rather than inherited from the workspace so
# the unused `derive` feature, and the proc-macro crate behind it, stay out of
# the dependency tree of a consumer that depends on this crate alone.
zeroize = { version = "1.8", default-features = false, features = ["alloc"] }

[dev-dependencies]
jsonschema = { version = "0.55.1", default-features = false }
proptest.workspace = true
tempfile.workspace = true
tokio = { workspace = true, features = [
  "io-util",
  "macros",
  "process",
  "sync",
  "time",
] }

[[example]]
name = "ssh_resolver"
required-features = ["tokio"]
