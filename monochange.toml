# :schema ./docs/src/schemas/monochange.schema.json

[defaults]
parent_bump = "patch"
include_private = false
warn_on_group_mismatch = true
package_type = "cargo"
changelog = false

[changelog.sections]
breaking = { heading = "Breaking", priority = 10 }
feat = { heading = "Features", priority = 20 }
fix = { heading = "Fixes", priority = 30 }
docs = { heading = "Documentation", priority = 40 }
other = { heading = "Other", priority = 50 }

[changelog.types]
major = { bump = "major", section = "breaking" }
breaking = { bump = "major", section = "breaking" }
feat = { bump = "minor", section = "feat" }
fix = { bump = "patch", section = "fix" }
docs = { bump = "none", section = "docs" }
none = { bump = "none", section = "other" }

[source]
provider = "github"
owner = "ifiokjr"
repo = "monosecret"

[cli.release]
help_text = "Prepare, format, commit, and open the release pull request."
steps = [
  { name = "prepare release", type = "PrepareRelease", allow_empty_changesets = true, inputs = { format = "json" } },
  { name = "format release commit", type = "Command", shell = "bash", command = "fix:format", when = "{{ number_of_changesets > 0 }}" },
  { name = "commit release", type = "CommitRelease", inputs = { stage_all = true, no_verify = true }, when = "{{ number_of_changesets > 0 }}" },
  { name = "open release request", type = "OpenReleaseRequest", inputs = { stage_all = true, no_verify = true }, when = "{{ number_of_changesets > 0 }}" },
]

[package."rust:monosecret"]
path = "crates/monosecret"
changelog = { path = "crates/monosecret/CHANGELOG.md", format = "keep_a_changelog" }

[package."rust:monosecret_derive"]
path = "crates/monosecret_derive"
changelog = { path = "crates/monosecret_derive/CHANGELOG.md", format = "keep_a_changelog" }

[package."rust:monosecret_ffi"]
path = "crates/monosecret_ffi"
changelog = false
publish = { enabled = false }

[package."@monosecret/cli"]
type = "npm"
path = "npm/monosecret__cli"

[package."@monosecret/client"]
type = "npm"
path = "npm/monosecret__client"
# Keep the canonical client versioned, but do not publish a manifest whose
# optional native packages are unavailable while native distribution is deferred.
publish = { enabled = false }

[package."@monosecret/client-darwin-arm64"]
type = "npm"
path = "npm/monosecret__client-darwin-arm64"
changelog = false
publish = { enabled = false }

[package."@monosecret/client-linux-arm64-gnu"]
type = "npm"
path = "npm/monosecret__client-linux-arm64-gnu"
changelog = false
publish = { enabled = false }

[package."@monosecret/client-linux-x64-gnu"]
type = "npm"
path = "npm/monosecret__client-linux-x64-gnu"
changelog = false
publish = { enabled = false }

[package."@monosecret/client-win32-x64-msvc"]
type = "npm"
path = "npm/monosecret__client-win32-x64-msvc"
changelog = false
publish = { enabled = false }

[package."@monosecret/skill"]
type = "npm"
path = "npm/monosecret__skill"

[package."@monosecret/cli-darwin-arm64"]
type = "npm"
path = "npm/monosecret__cli-darwin-arm64"

[package."@monosecret/cli-darwin-x64"]
type = "npm"
path = "npm/monosecret__cli-darwin-x64"
changelog = false

[package."@monosecret/cli-linux-arm64-gnu"]
type = "npm"
path = "npm/monosecret__cli-linux-arm64-gnu"
changelog = false

[package."@monosecret/cli-linux-arm64-musl"]
type = "npm"
path = "npm/monosecret__cli-linux-arm64-musl"
changelog = false

[package."@monosecret/cli-linux-x64-gnu"]
type = "npm"
path = "npm/monosecret__cli-linux-x64-gnu"
changelog = false

[package."@monosecret/cli-linux-x64-musl"]
type = "npm"
path = "npm/monosecret__cli-linux-x64-musl"
changelog = false

[package."@monosecret/cli-win32-arm64-msvc"]
type = "npm"
path = "npm/monosecret__cli-win32-arm64-msvc"
changelog = false

[package."@monosecret/cli-win32-x64-msvc"]
type = "npm"
path = "npm/monosecret__cli-win32-x64-msvc"
changelog = false

[package."dart"]
type = "dart"
path = "dart/monosecret"
changelog = { path = "dart/monosecret/CHANGELOG.md", format = "keep_a_changelog" }

[package."dart:monosecret_builder"]
type = "dart"
path = "dart/monosecret_builder"
changelog = { path = "dart/monosecret_builder/CHANGELOG.md", format = "keep_a_changelog" }

[group.monosecret]
packages = [
  "rust:monosecret",
  "rust:monosecret_derive",
  "rust:monosecret_ffi",
  "@monosecret/cli",
  "@monosecret/client",
  "@monosecret/client-darwin-arm64",
  "@monosecret/client-linux-arm64-gnu",
  "@monosecret/client-linux-x64-gnu",
  "@monosecret/client-win32-x64-msvc",
  "@monosecret/skill",
  "@monosecret/cli-darwin-arm64",
  "@monosecret/cli-darwin-x64",
  "@monosecret/cli-linux-arm64-gnu",
  "@monosecret/cli-linux-arm64-musl",
  "@monosecret/cli-linux-x64-gnu",
  "@monosecret/cli-linux-x64-musl",
  "@monosecret/cli-win32-arm64-msvc",
  "@monosecret/cli-win32-x64-msvc",
  "dart",
  "dart:monosecret_builder",
]
release = true
tag = true
version_format = "primary"
changelog = { path = "CHANGELOG.md", format = "keep_a_changelog", include = "all" }
versioned_files = [
  { path = "Cargo.toml", type = "cargo", fields = [
    "workspace.package.version",
  ] },
  { path = "python/monosecret_py/pyproject.toml", regex = 'version = "(?<version>[0-9]+[.][0-9]+[.][0-9]+[^\"]*)"' },
  { path = "ruby/monosecret_rb/monosecret_rb.gemspec", regex = 'spec[.]version *= *"(?<version>[0-9]+[.][0-9]+[.][0-9]+[^\"]*)"' },
  { path = "haskell/monosecret_hs/monosecret.cabal", regex = 'version: *(?<version>[0-9]+[.][0-9]+[.][0-9]+)' },
  { path = "dart/monosecret/lib/src/version.dart", regex = "const monosecretVersion = '(?<version>[^']+)';" },
  { path = "dotnet/monosecret_dotnet/src/Monosecret/Monosecret.csproj", regex = '<Version>(?<version>[0-9]+[.][0-9]+[.][0-9]+[^<]*)</Version>' },
  { path = "Package.swift", regex = 'let monosecretBinaryVersion = "(?<version>[0-9]+[.][0-9]+[.][0-9]+[^"]*)"' },
]

[ecosystems.cargo]
# Refresh Cargo.lock after a release bumps workspace versions. monochange's
# direct lockfile rewrite only updates released packages; workspace crates that
# inherit the workspace version via `version.workspace = true` (e.g.
# monosecret_client_native, monosecret_py_native) stay stale and break
# `cargo build --locked` in CI. `cargo update --workspace` syncs exactly those
# entries without touching dependencies.
lockfile_commands = [
  { command = "cargo update --workspace", cwd = ".", shell = "bash" },
]

[ecosystems.crates]
enabled = true
versioned_files = ["Cargo.toml"]
publish.enabled = true
publish.mode = "builtin"
publish.registry = "crates"

[ecosystems.dart]
enabled = true
publish.enabled = true
publish.mode = "builtin"
publish.registry = "pub_dev"
publish.trusted_publishing = true
versioned_files = [
  { path = "**/pubspec.yaml", type = "dart", fields = [
    "dependencies",
    "dev_dependencies",
  ] },
]

[ecosystems.npm]
publish.enabled = true
publish.mode = "builtin"
publish.registry = "npm"
enabled = true
publish.trusted_publishing = true


[changesets.affected]
enabled = true
required = true
skip_labels = ["release"]
comment_on_failure = true
changed_paths = ["codecov.yml"]
ignored_paths = [
  "**/tests/**",
  "**/__tests.rs",
  "**/snapshots/**",
  "fixtures/tests/**",
  "crates/*/changelog.md",
  "changelog.md",
  "dart/*/changelog.md",
  "npm/*/changelog.md",
]
