name: publish

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to publish (for example v0.1.0). Only used for manual retries; pub.dev trusted publishing requires the tag-push event below."
        required: true
        type: string
  push:
    tags:
      - "v*"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ inputs.tag || github.ref_name }}
  # Never cancel a publish mid-flight: a partial registry publish is worse than
  # a queued run waiting its turn.
  cancel-in-progress: false

jobs:
  publish:
    environment: publisher
    permissions:
      actions: read
      contents: read
      id-token: write
    if: github.repository_owner == 'ifiokjr' || github.repository_owner == 'monosecret'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      # On a tag push github.ref_name is the tag (e.g. v0.2.0); on a manual
      # workflow_dispatch retry inputs.tag is the tag.
      RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
      RELEASE_ASSET_TAG: ${{ inputs.tag || github.ref_name }}
    steps:
      - name: validate release tag input
        run: |
          set -euo pipefail
          if [[ "$RELEASE_TAG" != v* ]]; then
            echo "::error::Tag '$RELEASE_TAG' must be a release tag like v0.1.0" >&2
            exit 1
          fi

      - name: checkout release tag
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ inputs.tag || github.ref }}
          fetch-depth: 0

      - name: setup
        uses: ./.github/actions/devenv
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          free-runner-space: "true"

      - name: load publish secrets
        env:
          OP_SERVICE_ACCOUNT_TOKEN: ${{ secrets.OP_SERVICE_ACCOUNT_TOKEN }}
        run: |
          cargo run -p monosecret -- \
            --reason "Load PUB_TOKEN for Dart package publishing." \
            env --shell github --profile ci --include PUB_TOKEN
        shell: devenv shell -- bash -e {0}

      - name: get crates oidc auth token
        uses: rust-lang/crates-io-auth-action@c6f97d42243bad5fab37ca0427f495c86d5b1a18 # v1.0.5
        id: crates-oidc

      - name: setup cargo stable for publish
        uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # stable branch snapshot; installs stable
        with:
          toolchain: stable

      - name: setup node for publish
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 22

      - name: wait for release to be published
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          echo "Waiting for the release workflow to finish and publish the draft release for $RELEASE_TAG..."
          for attempt in $(seq 1 45); do
            if gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --json isDraft --jq '.isDraft' 2>/dev/null | grep -qx false; then
              echo "Release $RELEASE_TAG is published (no longer draft) after $attempt attempt(s)."
              exit 0
            fi
            echo "  attempt $attempt/45: release still draft or not yet created; sleeping 60s"
            sleep 60
          done
          echo "::error::Release $RELEASE_TAG was not published within the wait window. Check the release workflow run." >&2
          exit 1
        shell: bash

      - name: download release assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/release-assets"
          gh release download "$RELEASE_TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --pattern "monosecret-*-${RELEASE_ASSET_TAG}.tar.gz" \
            --pattern "monosecret-*-${RELEASE_ASSET_TAG}.zip" \
            --pattern "monosecret-ffi-*-${RELEASE_ASSET_TAG}.so" \
            --pattern "monosecret-ffi-*-${RELEASE_ASSET_TAG}.dylib" \
            --pattern "monosecret-ffi-*-${RELEASE_ASSET_TAG}.dll" \
            --pattern "monosecret-ffi-*-${RELEASE_ASSET_TAG}.sha256" \
            --pattern "monosecret-ffi-*-${RELEASE_ASSET_TAG}.sha512" \
            --dir "$RUNNER_TEMP/release-assets"
          find "$RUNNER_TEMP/release-assets" -maxdepth 1 -type f -print
          bash scripts/release/verify-ffi-assets.sh \
            "$RUNNER_TEMP/release-assets" \
            "$RELEASE_TAG"
        shell: bash

      - name: populate cli npm packages with release binaries
        run: |
          set -euo pipefail
          build:dist
          pnpm node scripts/npm/build-packages.js \
            --release-tag "$RELEASE_TAG" \
            --asset-tag "$RELEASE_ASSET_TAG" \
            --assets-dir "$RUNNER_TEMP/release-assets"
          pnpm node scripts/npm/populate-packages.js \
                      --packages-dir npm
        shell: devenv shell -- bash -e {0}

      - name: check publish readiness
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.crates-oidc.outputs.token }}
          NPM_CONFIG_PROVENANCE: "true"
        run: monochange step publish-readiness --from HEAD --output "$RUNNER_TEMP/publish-readiness.json" --format json
        shell: devenv shell -- bash -e {0}

      - name: publish packages with monochange
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.crates-oidc.outputs.token }}
          NPM_CONFIG_PROVENANCE: "true"
          # Stream child publish output so any auth prompt or hang is visible in
          # the job log instead of being buffered until process exit.
          PUBLISH_STREAM_OUTPUT: "true"
        run: |

          monochange step publish-packages \
            --log-level info \
            --all \
            --output "$RUNNER_TEMP/publish-result.json" \
            --format json
        shell: devenv shell -- bash -e {0}
