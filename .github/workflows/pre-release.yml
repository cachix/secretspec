name: "Pre-release"

# Runs every test and distributable-build workflow against the selected ref.
# It starts automatically for version bump PRs titled "Release ..." and remains
# available manually for any branch or tag. Publishing stays in tag workflows.

on:
  workflow_dispatch:
  pull_request:
    types: [opened, reopened, synchronize, edited]
    paths:
      - "CHANGELOG.md"
      - "Cargo.lock"
      - "Cargo.toml"
      - "secretspec/Cargo.toml"
      - "secretspec-derive/Cargo.toml"
      - "secretspec-hs/secretspec.cabal"
      - "secretspec-node/package.json"
      - "secretspec-py/pyproject.toml"
      - "secretspec-rb/secretspec.gemspec"
      - "secretspec-dotnet/src/SecretSpec/SecretSpec.csproj"
      - "secretspec-jvm/gradle.properties"
      - "Package.swift"
      - "secretspec-ex/**"
      - ".github/workflows/elixir-package.yml"

permissions:
  contents: read

concurrency:
  group: pre-release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  authorize:
    name: Release PR
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (
        startsWith(github.event.pull_request.title, 'Release ') &&
        (
          github.event.action != 'edited' ||
          github.event.changes.title.from != null
        )
      )
    runs-on: ubuntu-latest
    steps:
      - run: echo "Running the full pre-release suite for $GITHUB_SHA"

  # These inputs make this run canonical for release PRs. Each called workflow
  # still triggers directly for ordinary PRs, tags, and manual dispatches, but
  # suppresses its direct matrix when a "Release ..." PR invokes this suite.

  test:
    name: Rust tests
    needs: authorize
    uses: ./.github/workflows/test.yml
    with:
      pre_release: true

  sdks:
    name: SDK test suites
    needs: authorize
    uses: ./.github/workflows/sdks.yml
    with:
      pre_release: true

  ffi:
    name: FFI libraries
    needs: authorize
    permissions:
      contents: write
    uses: ./.github/workflows/ffi-build.yml
    with:
      pre_release: true

  node:
    name: Node packages
    needs: authorize
    permissions:
      contents: read
      id-token: write
    uses: ./.github/workflows/node-addon.yml
    with:
      pre_release: true
      publish: false

  elixir:
    name: Elixir SDK
    needs: authorize
    permissions:
      contents: read
    uses: ./.github/workflows/elixir-package.yml
    with:
      pre_release: true
      release_tag: ""

  python:
    name: Python wheels
    needs: authorize
    permissions:
      contents: read
      id-token: write
    uses: ./.github/workflows/python-wheels.yml
    with:
      pre_release: true

  ruby:
    name: Ruby gems
    needs: authorize
    permissions:
      contents: read
      id-token: write
    uses: ./.github/workflows/ruby-gems.yml
    with:
      pre_release: true

  php:
    name: PHP extensions
    needs: authorize
    permissions:
      contents: write
    uses: ./.github/workflows/php-ext.yml
    with:
      pre_release: true

  go-static:
    name: Go static library
    needs: authorize
    permissions:
      contents: write
    uses: ./.github/workflows/go-static.yml
    with:
      pre_release: true

  go-embed:
    name: Go embedded libraries
    needs: [authorize, ffi]
    permissions:
      contents: write
    uses: ./.github/workflows/go-embed.yml
    with:
      pre_release: true
      ffi_artifacts: true

  haskell:
    name: Haskell static-link build
    needs: authorize
    uses: ./.github/workflows/haskell-build.yml
    with:
      pre_release: true

  dotnet:
    name: .NET package
    needs: authorize
    permissions:
      contents: read
      id-token: write
    uses: ./.github/workflows/dotnet-package.yml
    with:
      pre_release: true

  swift:
    name: Swift package
    needs: authorize
    permissions:
      contents: write
    uses: ./.github/workflows/swift-package.yml
    with:
      pre_release: true

  jvm:
    name: JVM package
    needs: authorize
    permissions:
      contents: read
    uses: ./.github/workflows/jvm-package.yml
    with:
      pre_release: true

  release-artifacts:
    name: CLI release artifacts
    needs: authorize
    uses: ./.github/workflows/cli-artifacts.yml

  cli-windows-arm64:
    name: CLI Windows ARM64
    needs: authorize
    permissions:
      contents: write
    uses: ./.github/workflows/cli-windows-arm64.yml
