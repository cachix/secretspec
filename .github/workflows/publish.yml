name: publish

# Single workflow that builds release artifacts, publishes packages, and
# publishes the GitHub release. Triggered by a tag push (v*) so that pub.dev,
# crates.io, and npm trusted publishing (OIDC) accept the run — pub.dev in
# particular only accepts runs triggered by a pushed tag. workflow_dispatch is
# retained for manual retries where every package version already exists on its
# registry (monochange skips them, so no OIDC/OTP path is hit).
on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to publish (for example v0.1.0). Only used for manual retries; pub.dev trusted publishing requires the tag-push event below."
        required: true
        type: string
  push:
    tags:
      - "v*"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ inputs.tag || github.ref_name }}
  # Never cancel a publish mid-flight: a partial registry publish is worse than
  # a queued run waiting its turn.
  cancel-in-progress: false

# On a tag push github.ref_name is the tag (e.g. v0.2.0); on a manual
# workflow_dispatch retry inputs.tag is the tag.
env:
  RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
  RELEASE_ASSET_TAG: ${{ inputs.tag || github.ref_name }}

jobs:
  upload_assets:
    if: >-
      (github.repository_owner == 'ifiokjr' || github.repository_owner == 'monosecret') &&
      startsWith(inputs.tag || github.ref_name, 'v')
    permissions:
      attestations: write
      contents: write
      id-token: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
            ffi_library: libmonosecret_ffi.so
            ffi_extension: so
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-latest
            ffi_library: libmonosecret_ffi.so
            ffi_extension: so
          - target: x86_64-unknown-linux-musl
            os: ubuntu-latest
          - target: aarch64-unknown-linux-musl
            os: ubuntu-latest
          - target: x86_64-apple-darwin
            os: macos-26
            ffi_library: libmonosecret_ffi.dylib
            ffi_extension: dylib
          - target: aarch64-apple-darwin
            os: macos-14
            ffi_library: libmonosecret_ffi.dylib
            ffi_extension: dylib
          - target: x86_64-pc-windows-msvc
            os: windows-latest
            ffi_library: monosecret_ffi.dll
            ffi_extension: dll
          - target: aarch64-pc-windows-msvc
            os: windows-latest
            ffi_library: monosecret_ffi.dll
            ffi_extension: dll
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      # The release-pr tag job pushes the tag (firing this workflow) and then
      # creates the draft release. Wait for that draft release to exist before
      # uploading assets into it.
      - name: wait for draft release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          echo "Waiting for the draft release $RELEASE_TAG to be created by the release-pr tag job..."
          for attempt in $(seq 1 30); do
            if gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
              echo "Draft release $RELEASE_TAG exists after $attempt attempt(s)."
              exit 0
            fi
            echo "  attempt $attempt/30: release not found yet; sleeping 10s"
            sleep 10
          done
          echo "::error::Release $RELEASE_TAG was not created within the wait window. Check the release-pr tag job." >&2
          exit 1
      - name: checkout release tag
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ env.RELEASE_TAG }}
          fetch-depth: 0
      - name: install rust toolchain
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable branch snapshot; installs stable
        with:
          toolchain: stable
      - name: setup cross toolchain
        if: startsWith(matrix.os, 'ubuntu') && !contains(matrix.target, '-musl')
        uses: taiki-e/setup-cross-toolchain-action@3d9770ce98eb7dbcf378563182a5e8031165f75b # v1.41.0
        with:
          target: ${{ matrix.target }}
      - name: install cross
        if: contains(matrix.target, '-musl')
        uses: taiki-e/install-action@16b05812d776ae1dfaabc8277e421fb6d2506419 # v2.82.7
        with:
          tool: cross
      - name: set static crt linkage
        if: endsWith(matrix.target, 'windows-msvc')
        shell: bash
        run: echo "RUSTFLAGS=${RUSTFLAGS:-} -C target-feature=+crt-static" >> "$GITHUB_ENV"
      - name: derive release asset tag
        id: release_vars
        shell: bash
        run: |
          set -euo pipefail
          echo "asset_tag=${RELEASE_TAG//\//-}" >> "$GITHUB_OUTPUT"
      - name: upload binaries
        uses: taiki-e/upload-rust-binary-action@f0d45ae91ee7b8ee928de7a9d04d893a08bcbec6 # v1.30.2
        with:
          bin: monosecret
          manifest-path: crates/monosecret/Cargo.toml
          profile: release
          ref: refs/tags/${{ env.RELEASE_TAG }}
          archive: monosecret-$target-${{ steps.release_vars.outputs.asset_tag }}
          target: ${{ matrix.target }}
          tar: all
          zip: windows
          token: ${{ secrets.GITHUB_TOKEN }}
          checksum: sha256,sha512
      - name: build and upload C ABI
        if: matrix.ffi_library
        env:
          GH_TOKEN: ${{ github.token }}
          FFI_EXTENSION: ${{ matrix.ffi_extension }}
          FFI_LIBRARY: ${{ matrix.ffi_library }}
          RUST_TARGET: ${{ matrix.target }}
        shell: bash
        run: |
          set -euo pipefail
          cargo build --locked --release -p monosecret_ffi --target "$RUST_TARGET"

          asset_dir="$RUNNER_TEMP/monosecret-ffi-assets"
          stem="monosecret-ffi-${RUST_TARGET}-${RELEASE_TAG}"
          payload="${stem}.${FFI_EXTENSION}"
          mkdir -p "$asset_dir"
          cp "target/${RUST_TARGET}/release/${FFI_LIBRARY}" "$asset_dir/$payload"

          (
            cd "$asset_dir"
            if command -v sha256sum >/dev/null 2>&1; then
              sha256sum "$payload" > "${stem}.sha256"
              sha512sum "$payload" > "${stem}.sha512"
            else
              shasum -a 256 "$payload" > "${stem}.sha256"
              shasum -a 512 "$payload" > "${stem}.sha512"
            fi
          )

          gh release upload "$RELEASE_TAG" \
            "$asset_dir/$payload" \
            "$asset_dir/${stem}.sha256" \
            "$asset_dir/${stem}.sha512" \
            --clobber \
            --repo "$GITHUB_REPOSITORY"

  attest_assets:
    if: >-
      (github.repository_owner == 'ifiokjr' || github.repository_owner == 'monosecret') &&
      startsWith(inputs.tag || github.ref_name, 'v')
    needs: upload_assets
    permissions:
      attestations: write
      contents: write
      id-token: write
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: checkout release tag
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ env.RELEASE_TAG }}
          persist-credentials: false
      - name: download all release archives for attestation
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          asset_dir="$RUNNER_TEMP/release-asset-attestations"
          mkdir -p "$asset_dir"
          gh release download "$RELEASE_TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --pattern 'monosecret-*' \
            --dir "$asset_dir"
          shopt -s nullglob
          archives=("$asset_dir"/*)
          if [ ${#archives[@]} -eq 0 ]; then
            echo "::error::No release archives downloaded for $RELEASE_TAG" >&2
            exit 1
          fi
          sha256sum "$asset_dir"/*
          bash scripts/release/verify-ffi-assets.sh "$asset_dir" "$RELEASE_TAG"
      - name: attest all release archives
        uses: actions/attest-build-provenance@0f67c3f4856b2e3261c31976d6725780e5e4c373 # v4.1.1
        with:
          subject-path: ${{ runner.temp }}/release-asset-attestations/*
      - name: verify all release archive attestations
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          for archive in "$RUNNER_TEMP/release-asset-attestations"/*; do
            verified=false
            for attempt in 1 2 3 4 5; do
              if gh attestation verify "$archive" --repo "$GITHUB_REPOSITORY"; then
                verified=true
                break
              fi
              echo "Attestation for $archive is not available yet (attempt $attempt/5)."
              sleep 10
            done
            if [ "$verified" != true ]; then
              echo "::error::Failed to verify attestation for $archive" >&2
              exit 1
            fi
          done

  publish:
    needs: attest_assets
    environment: publisher
    permissions:
      contents: write
      id-token: write
    if: >-
      (github.repository_owner == 'ifiokjr' || github.repository_owner == 'monosecret') &&
      startsWith(inputs.tag || github.ref_name, 'v')
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: validate release tag input
        run: |
          set -euo pipefail
          if [[ "$RELEASE_TAG" != v* ]]; then
            echo "::error::Tag '$RELEASE_TAG' must be a release tag like v0.1.0" >&2
            exit 1
          fi
      - name: checkout release tag
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ env.RELEASE_TAG }}
          fetch-depth: 0
      - name: setup
        uses: ./.github/actions/devenv
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          free-runner-space: "true"
      - name: load publish secrets
        env:
          OP_SERVICE_ACCOUNT_TOKEN: ${{ secrets.OP_SERVICE_ACCOUNT_TOKEN }}
        run: |
          cargo run -p monosecret -- \
            --reason "Load PUB_TOKEN for Dart package publishing." \
            env --shell github --profile ci --include PUB_TOKEN
        shell: devenv shell -- bash -e {0}
      - name: get crates oidc auth token
        uses: rust-lang/crates-io-auth-action@c6f97d42243bad5fab37ca0427f495c86d5b1a18 # v1.0.5
        id: crates-oidc
      - name: setup cargo stable for publish
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable branch snapshot; installs stable
        with:
          toolchain: stable
      - name: setup node for publish
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 22
      - name: download release assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/release-assets"
          gh release download "$RELEASE_TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --pattern "monosecret-*-${RELEASE_ASSET_TAG}.tar.gz" \
            --pattern "monosecret-*-${RELEASE_ASSET_TAG}.zip" \
            --pattern "monosecret-ffi-*-${RELEASE_ASSET_TAG}.so" \
            --pattern "monosecret-ffi-*-${RELEASE_ASSET_TAG}.dylib" \
            --pattern "monosecret-ffi-*-${RELEASE_ASSET_TAG}.dll" \
            --pattern "monosecret-ffi-*-${RELEASE_ASSET_TAG}.sha256" \
            --pattern "monosecret-ffi-*-${RELEASE_ASSET_TAG}.sha512" \
            --dir "$RUNNER_TEMP/release-assets"
          find "$RUNNER_TEMP/release-assets" -maxdepth 1 -type f -print
          bash scripts/release/verify-ffi-assets.sh \
            "$RUNNER_TEMP/release-assets" \
            "$RELEASE_TAG"
        shell: bash
      - name: populate cli npm packages with release binaries
        run: |
          set -euo pipefail
          build:dist
          pnpm node scripts/npm/build-packages.js \
            --release-tag "$RELEASE_TAG" \
            --asset-tag "$RELEASE_ASSET_TAG" \
            --assets-dir "$RUNNER_TEMP/release-assets"
          pnpm node scripts/npm/populate-packages.js \
                      --packages-dir npm
        shell: devenv shell -- bash -e {0}
      - name: check publish readiness
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.crates-oidc.outputs.token }}
          NPM_CONFIG_PROVENANCE: "true"
        run: monochange step publish-readiness --from HEAD --output "$RUNNER_TEMP/publish-readiness.json" --format json
        shell: devenv shell -- bash -e {0}
      - name: publish packages with monochange
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.crates-oidc.outputs.token }}
          NPM_CONFIG_PROVENANCE: "true"
          # Stream child publish output so any auth prompt or hang is visible in
          # the job log instead of being buffered until process exit.
          PUBLISH_STREAM_OUTPUT: "true"
        run: |

          monochange step publish-packages \
            --log-level info \
            --all \
            --output "$RUNNER_TEMP/publish-result.json" \
            --format json
        shell: devenv shell -- bash -e {0}
      - name: publish draft release
        run: gh release edit "$RELEASE_TAG" --draft=false --latest --repo "${{ github.repository }}"
        env:
          GH_TOKEN: ${{ github.token }}
