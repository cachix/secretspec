name: release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag (for example v0.1.0). Must start with v."
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ inputs.tag }}
  cancel-in-progress: true

jobs:
  upload_assets:
    env:
      RELEASE_TAG: ${{ inputs.tag }}
    permissions:
      attestations: write
      contents: write
      id-token: write
    if: >-
      (github.repository_owner == 'ifiokjr' || github.repository_owner == 'monosecret') &&
      startsWith(inputs.tag, 'v')
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
            ffi_library: libmonosecret_ffi.so
            ffi_extension: so
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-latest
            ffi_library: libmonosecret_ffi.so
            ffi_extension: so
          - target: x86_64-unknown-linux-musl
            os: ubuntu-latest
          - target: aarch64-unknown-linux-musl
            os: ubuntu-latest
          - target: x86_64-apple-darwin
            os: macos-26
            ffi_library: libmonosecret_ffi.dylib
            ffi_extension: dylib
          - target: aarch64-apple-darwin
            os: macos-14
            ffi_library: libmonosecret_ffi.dylib
            ffi_extension: dylib
          - target: x86_64-pc-windows-msvc
            os: windows-latest
            ffi_library: monosecret_ffi.dll
            ffi_extension: dll
          - target: aarch64-pc-windows-msvc
            os: windows-latest
            ffi_library: monosecret_ffi.dll
            ffi_extension: dll
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      - name: checkout release tag
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ env.RELEASE_TAG }}
          fetch-depth: 0
      - name: install rust toolchain
        uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # stable branch snapshot; installs stable
        with:
          toolchain: stable
      - name: setup cross toolchain
        if: startsWith(matrix.os, 'ubuntu') && !contains(matrix.target, '-musl')
        uses: taiki-e/setup-cross-toolchain-action@3d9770ce98eb7dbcf378563182a5e8031165f75b # v1.41.0
        with:
          target: ${{ matrix.target }}
      - name: install cross
        if: contains(matrix.target, '-musl')
        uses: taiki-e/install-action@16b05812d776ae1dfaabc8277e421fb6d2506419 # v2.82.7
        with:
          tool: cross
      - name: set static crt linkage
        if: endsWith(matrix.target, 'windows-msvc')
        shell: bash
        run: echo "RUSTFLAGS=${RUSTFLAGS:-} -C target-feature=+crt-static" >> "$GITHUB_ENV"
      - name: derive release asset tag
        id: release_vars
        shell: bash
        run: |
          set -euo pipefail
          echo "asset_tag=${RELEASE_TAG//\//-}" >> "$GITHUB_OUTPUT"
      - name: upload binaries
        uses: taiki-e/upload-rust-binary-action@f0d45ae91ee7b8ee928de7a9d04d893a08bcbec6 # v1.30.2
        with:
          bin: monosecret
          manifest-path: crates/monosecret/Cargo.toml
          profile: release
          ref: refs/tags/${{ env.RELEASE_TAG }}
          archive: monosecret-$target-${{ steps.release_vars.outputs.asset_tag }}
          target: ${{ matrix.target }}
          tar: all
          zip: windows
          token: ${{ secrets.GITHUB_TOKEN }}
          checksum: sha256,sha512
      - name: build and upload C ABI
        if: matrix.ffi_library
        env:
          GH_TOKEN: ${{ github.token }}
          FFI_EXTENSION: ${{ matrix.ffi_extension }}
          FFI_LIBRARY: ${{ matrix.ffi_library }}
          RUST_TARGET: ${{ matrix.target }}
        shell: bash
        run: |
          set -euo pipefail
          cargo +stable build --locked --release -p monosecret_ffi --target "$RUST_TARGET"

          asset_dir="$RUNNER_TEMP/monosecret-ffi-assets"
          stem="monosecret-ffi-${RUST_TARGET}-${RELEASE_TAG}"
          payload="${stem}.${FFI_EXTENSION}"
          mkdir -p "$asset_dir"
          cp "target/${RUST_TARGET}/release/${FFI_LIBRARY}" "$asset_dir/$payload"

          (
            cd "$asset_dir"
            if command -v sha256sum >/dev/null 2>&1; then
              sha256sum "$payload" > "${stem}.sha256"
              sha512sum "$payload" > "${stem}.sha512"
            else
              shasum -a 256 "$payload" > "${stem}.sha256"
              shasum -a 512 "$payload" > "${stem}.sha512"
            fi
          )

          gh release upload "$RELEASE_TAG" \
            "$asset_dir/$payload" \
            "$asset_dir/${stem}.sha256" \
            "$asset_dir/${stem}.sha512" \
            --clobber \
            --repo "$GITHUB_REPOSITORY"

  attest_assets:
    if: >-
      (github.repository_owner == 'ifiokjr' || github.repository_owner == 'monosecret') &&
      startsWith(inputs.tag, 'v')
    needs: upload_assets
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      attestations: write
      contents: write
      id-token: write
    env:
      RELEASE_TAG: ${{ inputs.tag }}
    steps:
      - name: checkout release tag
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ env.RELEASE_TAG }}
          persist-credentials: false
      - name: download all release archives for attestation
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          asset_dir="$RUNNER_TEMP/release-asset-attestations"
          mkdir -p "$asset_dir"
          gh release download "$RELEASE_TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --pattern 'monosecret-*' \
            --dir "$asset_dir"
          shopt -s nullglob
          archives=("$asset_dir"/*)
          if [ ${#archives[@]} -eq 0 ]; then
            echo "::error::No release archives downloaded for $RELEASE_TAG" >&2
            exit 1
          fi
          sha256sum "$asset_dir"/*
          bash scripts/release/verify-ffi-assets.sh "$asset_dir" "$RELEASE_TAG"
      - name: attest all release archives
        uses: actions/attest-build-provenance@0f67c3f4856b2e3261c31976d6725780e5e4c373 # v4.1.1
        with:
          subject-path: ${{ runner.temp }}/release-asset-attestations/*
      - name: verify all release archive attestations
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          for archive in "$RUNNER_TEMP/release-asset-attestations"/*; do
            verified=false
            for attempt in 1 2 3 4 5; do
              if gh attestation verify "$archive" --repo "$GITHUB_REPOSITORY"; then
                verified=true
                break
              fi
              echo "Attestation for $archive is not available yet (attempt $attempt/5)."
              sleep 10
            done
            if [ "$verified" != true ]; then
              echo "::error::Failed to verify attestation for $archive" >&2
              exit 1
            fi
          done

  publish_draft:
    needs: attest_assets
    environment: publisher
    env:
      RELEASE_TAG: ${{ inputs.tag }}
    permissions:
      contents: write
    if: >-
      (github.repository_owner == 'ifiokjr' || github.repository_owner == 'monosecret') &&
      startsWith(inputs.tag, 'v')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: publish draft release
        run: gh release edit "$RELEASE_TAG" --draft=false --latest --repo "${{ github.repository }}"
        env:
          GH_TOKEN: ${{ github.token }}

  trigger_publish:
    needs: publish_draft
    environment: publisher
    env:
      RELEASE_TAG: ${{ inputs.tag }}
    permissions:
      actions: write
    if: >-
      (github.repository_owner == 'ifiokjr' || github.repository_owner == 'monosecret') &&
      startsWith(inputs.tag, 'v')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: trigger publish workflow
        run: |
          set -euo pipefail
          for attempt in {1..12}; do
            if git ls-remote --exit-code --tags "https://github.com/${GITHUB_REPOSITORY}.git" "refs/tags/${RELEASE_TAG}" >/dev/null 2>&1; then
              break
            fi
            echo "Release tag ${RELEASE_TAG} is not visible yet (attempt $attempt/12)."
            sleep 5
          done
          gh workflow run publish.yml \
            --repo "${{ github.repository }}" \
            -f "tag=$RELEASE_TAG"
        env:
          GH_TOKEN: ${{ github.token }}
