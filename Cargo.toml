[workspace]
members = ["crates/monosecret", "crates/monosecret_derive", "examples/derive"]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2024"

[workspace.dependencies]
aws-config = { default-features = false, version = "^1" }
aws-sdk-secretsmanager = { default-features = false, version = "^1" }
bitwarden = { version = "2", features = ["secrets"], default-features = false }
clap = { version = "4", features = ["derive", "env"], default-features = false }
colored = { default-features = false, version = "^3" }
data-encoding = { default-features = false, version = "^2" }
dotenvy = { default-features = false, version = "^0.15" }
etcetera = { default-features = false, version = "^0.11" }
google-cloud-secretmanager-v1 = { default-features = false, version = "^1.10.0" }
http = { default-features = false, version = "^1.4" }
inquire = { version = "0.9.4", features = [
  "experimental-multiline-input",
], default-features = false }
insta = { version = "1", features = [
  "filters",
  "json",
  "redactions",
], default-features = false }
insta-cmd = { default-features = false, version = "^0.7" }
apple-native-keyring-store = { version = "1.0.0", features = [
  "keychain",
], default-features = false }
keyring-core = { default-features = false, version = "^1" }
linkme = { default-features = false, version = "^0.3" }
miette = { version = "7.6", features = ["fancy"], default-features = false }
percent-encoding = { default-features = false, version = "^2.3" }
proc-macro2 = { default-features = false, version = "^1.0" }
quote = { default-features = false, version = "^1.0" }
rand = { default-features = false, version = "^0.10" }
reqwest = { version = "0.13.4", default-features = false, features = [
  "json",
  "rustls",
] }
rsa = { version = "0.9", features = ["pem"], default-features = false }
rustls = { version = "0.23", default-features = false, features = [
  "aws_lc_rs",
] }
secrecy = { version = "0.10.3", features = ["serde"], default-features = false }
serde = { version = "1.0", features = ["derive"], default-features = false }
serde_json = { default-features = false, version = "^1.0" }
syn = { default-features = false, version = "^2.0" }
tempfile = { default-features = false, version = "^3" }
thiserror = { default-features = false, version = "^2.0" }
tokio = { version = "1", features = [
  "rt",
  "rt-multi-thread",
], default-features = false }
toml = { default-features = false, version = "^1.1.2" }
toml_edit = { default-features = false, version = "^0.25.12" }
tracing = { default-features = false, version = "^0.1" }
trybuild = { default-features = false, version = "^1.0" }
url = { default-features = false, version = "^2.5" }
uuid = { version = "1", features = ["v4"], default-features = false }
windows-native-keyring-store = { default-features = false, version = "^1.1.0" }
zbus-secret-service-keyring-store = { version = "1.0.0", features = [
  "rt-tokio-crypto-rust",
], default-features = false }
detect-coding-agent = { default-features = false, version = "^0.1" }
whoami = { default-features = false, version = "^2.1" }
jiff = { default-features = false, version = "^0.2" }

# internal crates
monosecret = { version = "0.1.0", path = "./crates/monosecret", default-features = false }
monosecret_derive = { version = "0.1.0", path = "./crates/monosecret_derive" }
# The profile that 'dist' will build with
[profile.dist]
inherits = "release"
lto = "fat"
codegen-units = 1
strip = "symbols"

[workspace.lints.rust]
rust_2021_compatibility = { level = "warn", priority = -1 }
rust_2024_compatibility = { level = "warn", priority = -1 }
unsafe_code = "deny"
unstable_features = "deny"
unused_extern_crates = "warn"
unused_import_braces = "warn"
unused_lifetimes = "warn"
unused_macro_rules = "warn"
unused_qualifications = "warn"
variant_size_differences = "warn"
edition_2024_expr_fragment_specifier = "allow"

[workspace.lints.clippy]
complexity = { level = "warn", priority = -1 }
correctness = { level = "deny", priority = -1 }
pedantic = { level = "warn", priority = -1 }
perf = { level = "warn", priority = -1 }
style = { level = "warn", priority = -1 }
suspicious = { level = "warn", priority = -1 }
blocks_in_conditions = "allow"
cargo_common_metadata = "allow"
cast_possible_truncation = "allow"
cast_possible_wrap = "allow"
cast_precision_loss = "allow"
cast_sign_loss = "allow"
expl_impl_clone_on_copy = "allow"
items_after_statements = "allow"
indexing_slicing = "deny"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
module_name_repetitions = "allow"
must_use_candidate = "allow"
no_effect_underscore_binding = "allow"
tabs-in-doc-comments = "allow"
too_many_lines = "allow"
wildcard_dependencies = "deny"
wildcard_imports = "allow"
