# :schema ./docs/src/schemas/monochange.schema.json

[defaults]
parent_bump = "patch"
include_private = false
warn_on_group_mismatch = true
package_type = "cargo"
changelog = false

[changelog.sections]
breaking = { heading = "Breaking", priority = 10 }
feat = { heading = "Features", priority = 20 }
fix = { heading = "Fixes", priority = 30 }
docs = { heading = "Documentation", priority = 40 }
other = { heading = "Other", priority = 50 }

[changelog.types]
major = { bump = "major", section = "breaking" }
breaking = { bump = "major", section = "breaking" }
feat = { bump = "minor", section = "feat" }
fix = { bump = "patch", section = "fix" }
docs = { bump = "none", section = "docs" }
none = { bump = "none", section = "other" }

[source]
provider = "github"
owner = "ifiokjr"
repo = "monosecret"

[cli.release]
help_text = "Prepare, format, commit, and open the release pull request."
steps = [
  { name = "prepare release", type = "PrepareRelease", inputs = { format = "json" } },
  { name = "format release commit", type = "Command", shell = "bash", command = "fix:format" },
  { name = "commit release", type = "CommitRelease", inputs = { stage_all = true, no_verify = true } },
  { name = "open release request", type = "OpenReleaseRequest", inputs = { stage_all = true, no_verify = true } },
]

[package."rust:monosecret"]
path = "crates/monosecret"
changelog = { path = "crates/monosecret/CHANGELOG.md", format = "keep_a_changelog" }

[package."rust:monosecret_derive"]
path = "crates/monosecret_derive"
changelog = { path = "crates/monosecret_derive/CHANGELOG.md", format = "keep_a_changelog" }

[package."@monosecret/cli"]
type = "npm"
path = "npm/monosecret__cli"

[package."@monosecret/client"]
type = "npm"
path = "npm/monosecret__client"

[package."@monosecret/skill"]
type = "npm"
path = "npm/monosecret__skill"

[package."@monosecret/cli-darwin-arm64"]
type = "npm"
path = "npm/monosecret__cli-darwin-arm64"

[package."@monosecret/cli-darwin-x64"]
type = "npm"
path = "npm/monosecret__cli-darwin-x64"
changelog = false

[package."@monosecret/cli-linux-arm64-gnu"]
type = "npm"
path = "npm/monosecret__cli-linux-arm64-gnu"
changelog = false

[package."@monosecret/cli-linux-arm64-musl"]
type = "npm"
path = "npm/monosecret__cli-linux-arm64-musl"
changelog = false

[package."@monosecret/cli-linux-x64-gnu"]
type = "npm"
path = "npm/monosecret__cli-linux-x64-gnu"
changelog = false

[package."@monosecret/cli-linux-x64-musl"]
type = "npm"
path = "npm/monosecret__cli-linux-x64-musl"
changelog = false

[package."@monosecret/cli-win32-arm64-msvc"]
type = "npm"
path = "npm/monosecret__cli-win32-arm64-msvc"
changelog = false

[package."@monosecret/cli-win32-x64-msvc"]
type = "npm"
path = "npm/monosecret__cli-win32-x64-msvc"
changelog = false

[package."dart"]
type = "dart"
path = "dart/monosecret"
changelog = { path = "dart/monosecret/CHANGELOG.md", format = "keep_a_changelog" }

[package."dart:monosecret_builder"]
type = "dart"
path = "dart/monosecret_builder"
changelog = { path = "dart/monosecret_builder/CHANGELOG.md", format = "keep_a_changelog" }

[group.monosecret]
packages = [
  "rust:monosecret",
  "rust:monosecret_derive",
  "@monosecret/cli",
  "@monosecret/client",
  "@monosecret/skill",
  "@monosecret/cli-darwin-arm64",
  "@monosecret/cli-darwin-x64",
  "@monosecret/cli-linux-arm64-gnu",
  "@monosecret/cli-linux-arm64-musl",
  "@monosecret/cli-linux-x64-gnu",
  "@monosecret/cli-linux-x64-musl",
  "@monosecret/cli-win32-arm64-msvc",
  "@monosecret/cli-win32-x64-msvc",
  "dart",
  "dart:monosecret_builder",
]
release = true
tag = true
version_format = "primary"
changelog = { path = "CHANGELOG.md", format = "keep_a_changelog", include = "all" }
versioned_files = [
  { path = "Cargo.toml", type = "cargo", fields = [
    "workspace.package.version",
  ] },
]

[ecosystems.crates]
enabled = true
versioned_files = ["Cargo.toml"]
publish.enabled = true
publish.mode = "builtin"
publish.registry = "crates"

[ecosystems.dart]
enabled = true
publish.enabled = true
publish.mode = "builtin"
publish.registry = "pub_dev"
publish.trusted_publishing = true
versioned_files = [
  { path = "**/pubspec.yaml", type = "dart", fields = [
    "dependencies",
    "dev_dependencies",
  ] },
]

[ecosystems.npm]
publish.enabled = true
publish.mode = "builtin"
publish.registry = "npm"
enabled = true
publish.trusted_publishing = true


[changesets.affected]
enabled = true
required = true
skip_labels = ["release"]
comment_on_failure = true
changed_paths = ["codecov.yml"]
ignored_paths = [
  "**/tests/**",
  "**/__tests.rs",
  "**/snapshots/**",
  "fixtures/tests/**",
  "crates/*/changelog.md",
  "changelog.md",
  "dart/*/changelog.md",
  "npm/*/changelog.md",
]
